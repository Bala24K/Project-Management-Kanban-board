# Render Blueprint: one Docker web service + one managed PostgreSQL database.
# Deploy: Render dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: flowboard
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flowboard-db
          property: connectionString
      # Shows the "Simulate API failures" toggle so reviewers can see rollback.
      # Failures only happen when a user opts in via the toggle (no random failures).
      - key: FAILURE_SIMULATION
        value: "true"
      - key: FAILURE_RATE
        value: "0"

databases:
  - name: flowboard-db
    plan: free
    databaseName: flowboard
